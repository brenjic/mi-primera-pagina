<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión de Vehículos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Sistema de Revisión de Vehículos</h1>
    </header>

    <main>
        <section>
            <h2>Bienvenido</h2>
            <p id="mensaje">Bienvenido a mi sistema de revisión vehicular.</p>
        </section>
        <section>
            <h2>Consulta vehicular</h2>

            <p>Ingrese la placa del vehículo para comenzar la revisíon</p>

            <input type="text" id="placa" placeholder="Ingrese la placa" maxlength="6">
            <button id="consultar">Consultar</button>
            <p id="resultado"></p>
        </section>
    </main>
    <footer>
        <p>© 2026 Sistema de Revisión de Vehículos</p>

    </footer>
    <script src="script.js"></script>
</body>

</html>
